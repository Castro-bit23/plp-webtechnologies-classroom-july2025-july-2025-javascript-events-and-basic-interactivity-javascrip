<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 6 Assignment - Interactive Web Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation -->
  <header>
    <h1>Interactive Web Page</h1>
    <button id="theme-toggle">Toggle Dark Mode</button>
  </header>

  <!-- Interactive Section: FAQ -->
  <section class="faq">
    <h2>FAQ Section</h2>
    <div class="faq-item">
      <button class="faq-question">What is JavaScript?</button>
      <div class="faq-answer">JavaScript is a programming language that makes web pages interactive.</div>
    </div>
    <div class="faq-item">
      <button class="faq-question">What is DOM?</button>
      <div class="faq-answer">DOM stands for Document Object Model, which allows JavaScript to interact with HTML elements.</div>
    </div>
  </section>

  <!-- Interactive Section: Form -->
  <section class="form-section">
    <h2>Register Form</h2>
    <form id="register-form" novalidate>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name">
      <small class="error" id="nameError"></small>

      <label for="email">Email:</label>
      <input type="text" id="email" name="email">
      <small class="error" id="emailError"></small>

      <label for="password">Password:</label>
      <input type="password" id="password" name="password">
      <small class="error" id="passwordError"></small>

      <button type="submit">Submit</button>
      <p id="form-success" class="success"></p>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
